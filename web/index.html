<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
    <title>Boger Bowl Draft Time Wizard 98</title>
    <meta
      name="description"
      content="Official Boger Bowl fantasy draft time selector. Cinnamon rolls, corgis, and Elf Bowling required."
    />
    <meta property="og:title" content="Boger Bowl Draft Time Wizard 98" />
    <meta property="og:description" content="Mark your nights. Throw a strike. Do not call Aaron Rodgers by his last name." />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧝</text></svg>"
    />
    <link rel="stylesheet" href="https://unpkg.com/98.css@0.1.20/dist/98.css" />
    <link rel="stylesheet" href="./css/app.css" />
  </head>
  <body>
    <div id="boot" aria-live="polite"></div>

    <div id="desktop" hidden>
      <div id="snow"></div>
      <div id="icons">
        <button class="icon" data-open="wizard" type="button">
          <div class="glyph">🎳</div>
          Boger Bowl<br />Draft.exe
        </button>
        <button class="icon" data-open="results" type="button">
          <div class="glyph">📊</div>
          Results.xls
        </button>
        <button class="icon" data-open="readme" type="button">
          <div class="glyph">📄</div>
          family.txt
        </button>
        <button class="icon" data-open="rolls" type="button">
          <div class="glyph">🧁</div>
          cinnamon.bmp
        </button>
        <button class="icon" data-open="corgis" type="button">
          <div class="glyph">🐕</div>
          corgis\
        </button>
        <button class="icon" data-open="recycle" type="button">
          <div class="glyph">🗑️</div>
          Recycle Bin
        </button>
      </div>

      <div id="window-layer"></div>

      <div id="clippy">
        <div class="clippy-bubble" id="clippy-text">
          It looks like you're trying to schedule a family draft. Have you considered Christmas at Barbara's instead?
        </div>
        <div class="clippy-face" title="Stapley, now wearing a tiny Packers bow">📎</div>
      </div>

      <div id="start-menu" class="window">
        <div class="window-body" style="margin: 0; padding: 0">
          <div class="start-banner">Windows 98</div>
          <div class="start-items">
            <button type="button" data-open="wizard">🎳 Boger Bowl Draft</button>
            <button type="button" data-open="results">📊 Current Results</button>
            <button type="button" data-open="readme">📄 Family Rules</button>
            <button type="button" id="start-packers">🧀 Call him Rodgers</button>
            <button type="button" id="start-airbnb">🔌 Unplug a socket</button>
            <button type="button" id="start-run">▶️ Run...</button>
            <button type="button" id="start-shutdown">🔌 Shut Down...</button>
          </div>
        </div>
      </div>

      <div id="taskbar">
        <button id="start-btn" type="button">🪟 Start</button>
        <div id="task-buttons"></div>
        <div class="tray">
          <span title="Voicemail: Barbara (cinnamon rolls are in the oven). Also a corgi is on the keyboard.">🔊</span>
          <span id="clock">4:20 PM</span>
        </div>
      </div>
    </div>

    <div id="bsod"></div>
    <div id="confetti" class="confetti" hidden></div>

    <script type="module" src="./js/app.js"></script>
  </body>
</html>
